<title>TunezBot — Local Walkthrough</title>

<main class="doc">

  <header>
    <p class="type-line title" data-text="TUNEZBOT — LOCAL WALKTHROUGH"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line sub" data-text="&gt; how this runs on your PC, top to bottom"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </header>

  <div class="rule">――――――――――――――――――――――――――――――――――――――――</div>

  <section class="block">
    <p class="type-line h" data-text="1. SETUP  (once, before anything runs)"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line" data-text="Create a Discord application, then copy your bot token and server ID into .env. Run npm install once. Run npm run deploy — that registers all 16 slash commands to your server."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </section>

  <p class="connector type-line" data-text="&darr; setup only happens once. everything below runs every time you start the bot &darr;"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>

  <section class="block">
    <p class="type-line h" data-text="2. BOOT  (npm start)"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line" data-text="index.js starts as one Node process. It reads .env, logs into Discord's Gateway over a WebSocket, and registers the YouTube extractor. The bot now shows online and idle, waiting for a command."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </section>

  <p class="connector type-line" data-text="&darr; that Gateway connection is what carries every command below — nothing works if it drops &darr;"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>

  <section class="block">
    <p class="type-line h" data-text="3. COMMAND LOOP  (/tplay, /tqueue, /tskip ...)"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line" data-text="You run a command in a voice channel. Discord sends it to the bot over the Gateway. It checks you're in voice, turns your search text into a real URL with yt-dlp, joins your channel, and streams the audio in — replying in text and updating its status as it plays."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </section>

  <p class="connector type-line" data-text="&darr; this loop repeats for every command, for as long as the terminal stays open &darr;"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>

  <section class="block">
    <p class="type-line h" data-text="4. BACKGROUND  (running alongside the loop)"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line" data-text="Status refreshes every 3 seconds while a song plays. Queue, history, and artist mode are tracked in memory, per server. With nothing queued for 5 minutes, the bot leaves the voice channel on its own."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </section>

  <div class="rule">――――――――――――――――――――――――――――――――――――――――</div>

  <section class="block">
    <p class="type-line h warn" data-text="THE CATCH"><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line" data-text="All of this lives in one process, in one open terminal, on this PC. Close the window, sleep the machine, or lose internet, and the bot drops offline — and every bit of that memory resets the next time you run npm start."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
    <p class="type-line dim" data-text="— a Raspberry Pi version, built to stay on, is next."><span class="txt"></span><span class="type-cursor">&#9612;</span></p>
  </section>

  <p class="end-cursor"><span class="cursor">&#9612;</span></p>

</main>

<style>

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(ellipse 900px 700px at 50% 0%, var(--screen), var(--screen-2) 85%);

<script>
(function(){
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var lines = Array.prototype.slice.call(document.querySelectorAll(".type-line[data-text]"));

  if(reduceMotion){
    lines.forEach(function(el){
      var t = el.querySelector(".txt");
      if(t) t.textContent = el.getAttribute("data-text") || "";
    });
    return;
  }

  var queue = [];
  var typing = false;

  function typeElement(el, done){
    var full = el.getAttribute("data-text") || "";
    var txtEl = el.querySelector(".txt");
    el.classList.add("is-typing");
    var i = 0;

    function step(){
      i++;
      txtEl.textContent = full.slice(0, i);
      if(i < full.length){
        var ch = full[i - 1];
        var delay = 11 + Math.random() * 16;
        if(ch === ",") delay += 70;
        if(ch === "." || ch === "—" || ch === ":") delay += 150;
        setTimeout(step, delay);
      } else {
        el.classList.remove("is-typing");
        if(done) done();
      }
    }
    step();
  }

  function processQueue(){
    if(typing || queue.length === 0) return;
    typing = true;
    var el = queue.shift();
    typeElement(el, function(){
      typing = false;
      processQueue();
    });
  }

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        queue.push(entry.target);
        io.unobserve(entry.target);
        processQueue();
      }
    });
  }, { threshold: 0.4, rootMargin: "0px 0px -10% 0px" });

  lines.forEach(function(el){ io.observe(el); });
})();
</script>
